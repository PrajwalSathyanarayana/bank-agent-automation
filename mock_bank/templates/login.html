<!DOCTYPE html>
<html>
<head><title>Sunbelt Credit Union - Staff Portal Login</title></head>
<body>
<table width="400" cellpadding="4" cellspacing="0" border="0" align="center">
  <tr>
    <td colspan="2" align="center"><b>Sunbelt Credit Union &mdash; Staff Portal</b></td>
  </tr>
  {% if error %}
  <tr>
    <td colspan="2" align="center"><font color="red">{{ error }}</font></td>
  </tr>
  {% endif %}
  <tr>
    <td colspan="2">
      <form method="POST" action="/login">
        <table cellpadding="2" cellspacing="0" border="0" width="100%">
          <tr>
            <td>Username:</td>
            <td><input type="text" name="username" size="20"></td>
          </tr>
          <tr>
            <td>Password:</td>
            <td><input type="password" name="password" size="20"></td>
          </tr>
          <tr>
            <td colspan="2" align="center"><input type="submit" value="Log In"></td>
          </tr>
        </table>
      </form>
    </td>
  </tr>
</table>
</body>
</html>
